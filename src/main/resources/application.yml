# Resilience4j configuration
resilience4j:
  circuitbreaker:
    instances:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
# Logging
logging:
  level:
    root: INFO
    org:
      springframework:
        web: INFO

# Prometheus and Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    prometheus:
      enabled: true
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces
      export:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

# CORS configuration (leave blank to disable global CORS; set comma-separated origins to enable)
#app:
#  cors:
    # Leave empty in production or when you prefer no global CORS mapping. Example: "https://app.jugaads.co.iz,https://admin.jugaads.co.iz"
#    allowed-origins: "*"
#    allow-credentials: false

app:
  secrets:
    enabled: false
