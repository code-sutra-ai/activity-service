# Enable AWS Secrets Manager for prod and list secret ids to fetch. When enabled, the AwsSecretsManagerConfig
# will register found secret values into the Spring Environment and (when profile=prod) map Cognito fields
# (issuer-uri, client-id, client-secret, user-name-attribute, redirect-uri, scope) from the secrets into the corresponding
# Spring properties so the application picks them up.
#app:
#  secrets:
#    enabled: true
#    # Comma separated list of secret ids to fetch from AWS Secrets Manager for prod.
#    # Use the managed secret named 'code-sutra-secrets' by default; replace with your actual secret path/ids or ARNs.
#    names: "prod/code-sutra/activity-service"
#    # Optional AWS region override (if your role/host doesn't provide region info)
#    region: "us-east-1"

spring:
  config:
    import: optional:aws-secretsmanager:prod/code-sutra/activity-service