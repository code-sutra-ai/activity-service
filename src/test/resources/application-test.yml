spring:
  application:
    name: activity-service
  management:
    endpoint:
      health:
        show-details: always
    tracing:
      enabled: true
      sampling:
        probability: 1.0
    endpoints:
      web:
        exposure:
          include: '*'
    metrics:
      export:
        prometheus:
          enabled: true
  logging:
    level:
      root: WARN
    pattern:
      console:
      #console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file:
      name: logs/activity.log
    logback:
      rollingpolicy:
        file-name-pattern: logs/activity-%d{yyyy-MM-dd}.%i.log.gz
        max-file-size: 10MB
        max-history: 30
        total-size-cap: 100MB

COGNITO_JWK_URL: "http://localhost/dummy-jwk"